name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: synthetic-lab-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,rl,agent]"
      - run: python -m pip install -e examples/tank-package
      - run: python -m pip install -e labs/optical-metrology
      - run: python -m pip install -e labs/spectroscopic-bioprocess
      - run: python -m pip install "git+https://github.com/EnvFoundry/Verifiable-Agent-Gym.git@947d59f7af9914b8230d81c7205a89740d24802b"
      - run: ruff check src labs examples scripts tests
      - run: ruff format --check src labs examples scripts tests
      - run: pytest -q
      - run: python examples/open_research.py
      - run: python examples/align_fiber.py
      - run: python examples/battery_pulse.py
      - run: python examples/optimize_reaction.py
      - run: python examples/coat_thin_film.py
      - run: python examples/adaptive_microscopy.py
      - run: python examples/optimize_bioprocess.py
      - run: python -m build
      - run: python -m build labs/optical-metrology
      - run: python -m build labs/spectroscopic-bioprocess
      - run: python -m build examples/tank-package

  pybamm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYBAMM_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" -e labs/pybamm-battery
      - run: pytest -q tests/test_pybamm_battery.py
      - run: python examples/compare_pybamm_models.py
      - run: python -m build labs/pybamm-battery

  physicell-organoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set PhysiCell paths
        run: |
          echo "PHYSICELL_ORGANOID_EXECUTABLE=${RUNNER_TEMP}/PhysiCell/organoid_therapy" >> "${GITHUB_ENV}"
          echo "PHYSICELL_ORGANOID_CONFIG=${RUNNER_TEMP}/PhysiCell/config/PhysiCell_settings.xml" >> "${GITHUB_ENV}"
      - run: git clone --depth 1 --branch 1.14.2 https://github.com/MathCancer/PhysiCell.git "${RUNNER_TEMP}/PhysiCell"
      - run: python labs/physicell-organoid/build_physicell.py "${RUNNER_TEMP}/PhysiCell"
      - run: make -C "${RUNNER_TEMP}/PhysiCell" -j2
      - run: python -m pip install -e ".[test]" -e labs/physicell-organoid
      - run: pytest -q tests/test_physicell_organoid.py
      - run: python examples/screen_tumor_organoid.py
      - run: python -m build labs/physicell-organoid

  meep:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: synthetic-lab-meep
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - run: conda install -y -c conda-forge pymeep numpy pip
      - run: python -m pip install -e ".[test]" -e labs/meep-photonics
      - run: pytest -q tests/test_meep_photonics.py
      - run: python examples/measure_photonic_cavity.py
      - run: python -m build labs/meep-photonics

  protocol:
    runs-on: ubuntu-latest
    env:
      PYBAMM_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e examples/tank-package -e labs/optical-metrology -e labs/spectroscopic-bioprocess -e labs/pybamm-battery
      - run: python scripts/export_protocol_fixtures.py runs/protocol.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix packages/protocol-ts
      - run: npm run check --prefix packages/protocol-ts
      - run: npm test --prefix packages/protocol-ts
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run --locked --example check_runtime -- runs/protocol.json
