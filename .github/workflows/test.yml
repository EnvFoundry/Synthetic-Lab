name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,rl,agent]"
      - run: python -m pip install -e examples/tank-package
      - run: python -m pip install "git+https://github.com/EnvFoundry/Verifiable-Agent-Gym.git@947d59f7af9914b8230d81c7205a89740d24802b"
      - run: ruff check src examples tests
      - run: ruff format --check src examples tests
      - run: pytest -q
      - run: python examples/open_research.py
      - run: python examples/align_fiber.py
      - run: python examples/battery_pulse.py
      - run: python -m build
