[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envfoundry-synthetic-lab"
version = "0.1.0"
description = "Persistent physical experiment simulations for autonomous research"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "EnvFoundry contributors"}]
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2", "numpy>=1.24"]
agent = ["mcp>=1.12,<2"]
test = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
synthetic-lab = "synthetic_lab.cli:main"

[project.urls]
Repository = "https://github.com/EnvFoundry/Synthetic-Lab"
Issues = "https://github.com/EnvFoundry/Synthetic-Lab/issues"

[project.entry-points."agent_gym.tasks"]
synthetic-thermal = "synthetic_lab.integrations.agent_gym:make"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
