[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-lab-tank-example"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["envfoundry-synthetic-lab>=0.1,<0.3"]

[project.entry-points."synthetic_lab.models"]
fluid-tank = "tank_lab:Tank"

[tool.setuptools]
py-modules = ["tank_lab"]
