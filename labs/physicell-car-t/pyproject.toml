[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envfoundry-physicell-car-t-lab"
version = "0.1.0"
description = "PhysiCell-backed solid-tumor CAR-T spheroid laboratory for Synthetic Lab"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "envfoundry-synthetic-lab>=0.2,<0.3",
]

[project.entry-points."synthetic_lab.models"]
physicell-car-t-spheroid = "physicell_car_t.lab:CarTSpheroidLab"

[tool.setuptools.packages.find]
where = ["."]
