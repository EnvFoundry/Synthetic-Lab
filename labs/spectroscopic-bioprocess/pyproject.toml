[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envfoundry-spectroscopic-bioprocess-lab"
version = "0.1.0"
description = "Spectroscopic fed-batch bioprocess laboratory for Synthetic Lab"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["envfoundry-synthetic-lab>=0.2,<0.3"]

[project.entry-points."synthetic_lab.models"]
spectroscopic-bioreactor = "spectroscopic_bioprocess.bioreactor:SpectroscopicBioreactor"

[tool.setuptools.packages.find]
where = ["."]
