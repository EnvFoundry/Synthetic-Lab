[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envfoundry-optical-metrology-labs"
version = "0.1.0"
description = "Optical metrology laboratories for Synthetic Lab"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.entry-points."synthetic_lab.models"]
thin-film = "optical_metrology.thin_film:ThinFilmBench"
fluorescence-microscopy = "optical_metrology.microscopy:FluorescenceMicroscopy"

[project.entry-points."agent_gym.tasks"]
synthetic-thin-film-endpoint = "optical_metrology.agent_gym:make_thin_film_endpoint"
synthetic-microscopy-focus = "optical_metrology.agent_gym:make_microscopy_focus"

[tool.setuptools.packages.find]
where = ["."]
